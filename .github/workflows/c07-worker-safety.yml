name: C07 worker safety

on:
  workflow_dispatch:

concurrency:
  group: c07-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aidbridge_test
          POSTGRES_USER: aidbridge_app
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidbridge_app -d aidbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/aidbridge_test
      DB_USERNAME: aidbridge_app
      DB_PASSWORD: ci-local-only
      AIDBRIDGE_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/aidbridge_test
      AIDBRIDGE_TEST_DATABASE_USERNAME: aidbridge_app
      AIDBRIDGE_TEST_DATABASE_PASSWORD: ci-local-only
      AIDBRIDGE_E2E_HARDHAT_RPC_URL: http://127.0.0.1:8545
      BLOCKCHAIN_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked local-chain dependencies
        working-directory: contracts
        run: npm ci --ignore-scripts
      - name: Start isolated Hardhat (never Fuji)
        working-directory: contracts
        run: |
          node node_modules/hardhat/dist/src/cli.js node --hostname 127.0.0.1 > "$RUNNER_TEMP/aidbridge-hardhat.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | grep -q '0x7a69'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Compile and run worker unit / PostgreSQL / local-chain regressions
        working-directory: backend/aidbridge-backend
        run: >-
          bash ./mvnw -B -ntp
          -Dtest=CaseVerifiedReceiptVerifierTest,Web3jBlockchainAdapterTest,JobSecretCipherTest,GoldenVectorParityTest,BlockchainDisabledConfigurationTest
          -Dit.test=CaseVerifiedWorkerIT,BlockchainTransactionPersistenceIT,CaseVerifiedHardhatE2EIT
          verify
      - name: Require real integration execution with no skips
        if: success()
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('backend/aidbridge-backend/target/failsafe-reports')
          expected = {'CaseVerifiedWorkerIT', 'BlockchainTransactionPersistenceIT', 'CaseVerifiedHardhatE2EIT'}
          seen = set()
          for path in root.glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              name = suite.attrib['name'].rsplit('.', 1)[-1]
              if name in expected:
                  assert int(suite.attrib['tests']) > 0, name
                  for attr in ('skipped', 'errors', 'failures'):
                      assert int(suite.attrib.get(attr, 0)) == 0, (name, attr)
                  seen.add(name)
          assert seen == expected, (seen, expected)
      - name: Upload test summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c07-test-summaries
          path: |
            backend/aidbridge-backend/target/surefire-reports/TEST-*.xml
            backend/aidbridge-backend/target/failsafe-reports/TEST-*.xml
          retention-days: 7
