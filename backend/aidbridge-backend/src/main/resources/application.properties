spring.application.name=aidbridge-backend
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aidbridge}
spring.datasource.username=${DB_USERNAME:aidbridge_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

server.port=8081

# Blockchain (C05). Disabled by default; secrets only from environment variables.
aidbridge.blockchain.enabled=${BLOCKCHAIN_ENABLED:false}
aidbridge.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:}
aidbridge.blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:31337}
aidbridge.blockchain.registry-address=${BLOCKCHAIN_REGISTRY_ADDRESS:}
aidbridge.blockchain.relayer-private-key=${BLOCKCHAIN_RELAYER_PRIVATE_KEY:}
aidbridge.blockchain.secret-key=${BLOCKCHAIN_SECRET_KEY:}
aidbridge.blockchain.poll-interval-ms=${BLOCKCHAIN_POLL_INTERVAL_MS:5000}
